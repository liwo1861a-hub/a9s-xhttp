name: EdgeOps Telemetry CI/CD

on:
  workflow_dispatch:
    inputs:
      cf_user:
        description: 'Target Deployment Identity'
        required: false
        default: ''
  schedule:
    - cron: '0 3 */25 * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Enterprise Cloud Foundry Toolchain
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --dearmor -o /usr/share/keyrings/cloudfoundry.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Deploy Edge Telemetry Engine
        env:
          CF_USER: ${{ github.event.inputs.cf_user || secrets.A9S_USERNAME }}
          CF_PASS: ${{ secrets.A9S_PASSWORD }}
          CF_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_KEY: ${{ secrets.CF_API_KEY }}
          CF_ACCOUNT_ID: "26ab36a2d6f8837c504ffe9e56949f34"
          SUB_KV_ID: "816df83f59a84f81bd2f4cbb77657af6"
          CHANNEL_PATH: "/telemetry/v1/stream"
        run: |
          echo "Authenticating deployment context..."
          cf api https://api.de.a9s.eu
          cf auth "$CF_USER" "$CF_PASS"

          ORG=$(cf orgs | awk 'NR>3 {print $1; exit}')
          echo "Targeting Space: $ORG / production"
          cf target -o "$ORG" -s production

          PREFIX=$(echo "$CF_USER" | cut -d'@' -f1 | sed 's/[^a-zA-Z0-9-]/-/g')
          ORIGIN_HOST="edge-${PREFIX}.de.a9sapp.eu"
          echo "Binding route: $ORIGIN_HOST"

          # 动态全新生成全局唯一 UUID，并动态混淆写入 server.js 内存密文 (零环境变量泄漏)
          AUTH_ID=$(node -e "
            const fs = require('fs');
            const uuid = require('crypto').randomUUID();
            const k = Buffer.from('3a7f9c2d', 'hex');
            const b = Buffer.from(uuid);
            const enc = Buffer.alloc(b.length);
            for (let i = 0; i < b.length; i++) enc[i] = b[i] ^ k[i % k.length];
            const hex = enc.toString('hex');
            let code = fs.readFileSync('server.js', 'utf8');
            code = code.replace(/const DEFAULT_AUTH_ID = _decodeMetric\('[^']+'/, \"const DEFAULT_AUTH_ID = _decodeMetric('\" + hex + \"'\");
            fs.writeFileSync('server.js', code);
            console.log(uuid);
          ")
          echo "Dynamic ephemeral credential compiled into code payload."

          cf delete telemetry-edge -f -r || true
          cf push -d de.a9sapp.eu --hostname "edge-${PREFIX}"

          NODE_LINK="vless://${AUTH_ID}@${ORIGIN_HOST}:443?security=tls&encryption=none&type=ws&host=${ORIGIN_HOST}&sni=${ORIGIN_HOST}&path=${CHANNEL_PATH}#EdgeOps-Direct"

          # 静默热同步节点至 Cloudflare 安全订阅存储 (Karing 订阅自动无缝拉取)
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_KEY" ]; then
            echo "Synchronizing node payload to secure subscription storage..."
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$SUB_KV_ID/values/xhttp_sub_node" \
              -H "X-Auth-Email: $CF_EMAIL" \
              -H "X-Auth-Key: $CF_KEY" \
              -d "$NODE_LINK" || true
          fi

          echo "Deployment lifecycle completed successfully."
